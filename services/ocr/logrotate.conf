# Log retention for the OCR host: nothing older than 30 days is kept.
# Installed by deploy.ts as /app/logrotate.conf and run daily by a small loop
# (vast.ai containers usually have no cron). copytruncate because the processes
# keep their log file open (nohup ... > file).
/app/server.log /app/vllm.log {
    daily
    rotate 30
    maxage 30
    missingok
    notifempty
    copytruncate
    compress
    delaycompress
}
