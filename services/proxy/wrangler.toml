name = "nemu-service"
main = "service.ts"
compatibility_date = "2024-01-01"
compatibility_flags = [
  "global_fetch_strictly_public",
  "brotli_content_encoding",
  "fetch_standard_url",
  "cache_option_enabled",
  "enable_request_signal",
]
workers_dev = false
preview_urls = false

[vars]
RATE_LIMIT_REQUESTS = "100"
RATE_LIMIT_WINDOW_MS = "60000"
CACHE_TTL_MS = "300000"
MAX_CACHE_SIZE = "1000"
ALLOWED_ORIGINS = "https://nemu.pm,http://localhost:5173,http://127.0.0.1:5173"
PROXY_ORIGINS = "https://service.nemu.pm"
# ALLOWED_DOMAINS = ""  # Uncomment and set to restrict domains
