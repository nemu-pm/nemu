name: Mobile

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name != 'workflow_dispatch' }}

on:
  pull_request:
    paths:
      - "apps/mobile/**"
      - "convex/**"
      - "convex.json"
      - "packages/**"
      - "src/**"
      - "vendor/**"
      - "package.json"
      - "bun.lock"
      - "bunfig.toml"
      - "patches/**"
      - "scripts/**"
      - "tests/**"
      - "eslint.config.js"
      - "tsconfig*.json"
      - "vite.config.ts"
      - ".gitmodules"
      - ".github/workflows/mobile.yml"
  push:
    branches:
      - master
    paths:
      - "apps/mobile/**"
      - "convex/**"
      - "convex.json"
      - "packages/**"
      - "src/**"
      - "vendor/**"
      - "package.json"
      - "bun.lock"
      - "bunfig.toml"
      - "patches/**"
      - "scripts/**"
      - "tests/**"
      - "eslint.config.js"
      - "tsconfig*.json"
      - "vite.config.ts"
      - ".gitmodules"
      - ".github/workflows/mobile.yml"
  workflow_dispatch:
    inputs:
      profile:
        description: "EAS build profile"
        required: true
        default: "production"
        type: choice
        options:
          - production
          - preview
          - development
      platform:
        description: "EAS build platform"
        required: true
        default: "all"
        type: choice
        options:
          - all
          - ios
          - android

jobs:
  shared:
    name: Shared core and web
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"
      - name: Restore Bun package cache
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Test shared core and web
        run: bun run test
      - name: Typecheck shared core, web, and Convex
        run: bun run typecheck
      - name: Lint shared core and web
        run: bun run lint
      - name: Build web app
        run: bun run build

  mobile:
    name: Mobile JavaScript
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"
      - name: Restore Bun package cache
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Check Expo dependency alignment
        working-directory: apps/mobile
        run: bunx expo install --check
      - name: Typecheck mobile app
        run: bun run --cwd apps/mobile typecheck
      - name: Lint mobile app
        run: bun run --cwd apps/mobile lint
      - name: Test mobile app
        run: bun run --cwd apps/mobile test
      - name: Diagnose Expo dependencies
        working-directory: apps/mobile
        run: bunx expo-doctor
      - name: Validate Expo prebuild configuration
        working-directory: apps/mobile
        run: bunx expo config --type prebuild >/tmp/nemu-mobile-prebuild-config.txt
      - name: Export production iOS bundle
        working-directory: apps/mobile
        env:
          NODE_ENV: production
        run: bunx expo export --platform ios --output-dir /tmp/nemu-mobile-export
      - name: Export production Android bundle
        working-directory: apps/mobile
        env:
          NODE_ENV: production
        run: bunx expo export --platform android --output-dir /tmp/nemu-mobile-export-android

  android-native:
    name: Android native
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"
      - name: Restore Bun package cache
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-
      - uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"
          cache: gradle
          cache-dependency-path: |
            bun.lock
            apps/mobile/modules/*/android/*.gradle
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Generate Android native project
        working-directory: apps/mobile
        run: bunx expo prebuild --platform android --no-install
      - name: Test, lint, and assemble Android native modules and app
        working-directory: apps/mobile/android
        run: |
          # Bound parallel JVM-heavy R8/lint work so a hosted runner does not
          # exhaust the 2 GB Gradle heap when the full matrix runs.
          ./gradlew --no-daemon --console=plain --max-workers=2 \
            clean \
            :nemu-aidoku:testDebugUnitTest \
            :nemu-aidoku:testReleaseUnitTest \
            :nemu-aidoku:lintDebug \
            :nemu-aidoku:lintRelease \
            :app:assembleDebug \
            :app:assembleRelease \
            :app:lintDebug \
            :app:lintRelease \
            -PreactNativeArchitectures=arm64-v8a
      - name: Verify Android release source network policy
        working-directory: apps/mobile/android
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/apkanalyzer" manifest print \
            app/build/outputs/apk/release/app-release.apk \
            | grep -F 'android:usesCleartextTraffic="true"'
      - name: Upload Android failure reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: android-native-reports-${{ github.run_attempt }}
          path: |
            apps/mobile/android/**/build/reports/**
            apps/mobile/android/**/build/test-results/**
          if-no-files-found: ignore
          retention-days: 7

  ios-native:
    name: iOS native
    # React Native is built from source for the third-party JSC runtime. The
    # standard macOS 26 Arm runner has only 7 GB of memory; use the 14 GB Intel
    # image so parallel Swift/C++ compilation does not become an avoidable CI
    # OOM. Device Release remains a cross-compile and does not require signing.
    runs-on: macos-26-intel
    # The Release + Debug xcodebuild pair takes ~115 minutes on a healthy
    # run — 120 left no margin and timed out on slow runners.
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"
      - name: Restore Bun package cache
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-
      - name: Restore CocoaPods download cache
        uses: actions/cache@v4
        with:
          path: ~/Library/Caches/CocoaPods
          key: ${{ runner.os }}-cocoapods-${{ hashFiles('bun.lock', 'apps/mobile/modules/*/ios/*.podspec') }}
          restore-keys: |
            ${{ runner.os }}-cocoapods-
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Generate iOS native project
        working-directory: apps/mobile
        run: bunx expo prebuild --platform ios --no-install
      - name: Install CocoaPods
        working-directory: apps/mobile/ios
        run: pod install
      - name: Test iOS native source policies
        working-directory: apps/mobile
        run: |
          test_dir="$(mktemp -d)"
          trap 'rm -rf "$test_dir"' EXIT
          xcrun swiftc \
            modules/nemu-aidoku/ios/NemuNativeHttpAddressPolicy.swift \
            modules/nemu-aidoku/ios/NemuNativeHttpLoopbackProxy.swift \
            modules/nemu-aidoku/runtime/iosTest/NemuNativeHttpAddressPolicyTests.swift \
            -framework Network \
            -o "$test_dir/address-tests"
          "$test_dir/address-tests"
          xcrun swiftc \
            modules/nemu-aidoku/ios/NemuImageMetadataPolicy.swift \
            modules/nemu-aidoku/runtime/iosTest/NemuImageMetadataPolicyTests.swift \
            -framework ImageIO \
            -o "$test_dir/image-tests"
          "$test_dir/image-tests"
      - name: Build iOS Debug simulator app
        working-directory: apps/mobile/ios
        run: |
          xcodebuild \
            -workspace Nemu.xcworkspace \
            -scheme Nemu \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath /tmp/nemu-ios-derived-Debug \
            CODE_SIGNING_ALLOWED=NO \
            build
          # A from-source React Native build can occupy several GiB. The
          # standard runner has 14 GB of SSD, so do not retain a simulator
          # DerivedData tree while compiling the independent device Release.
          rm -rf /tmp/nemu-ios-derived-Debug
      - name: Build iOS Release device app
        working-directory: apps/mobile/ios
        run: |
          xcodebuild \
            -workspace Nemu.xcworkspace \
            -scheme Nemu \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath /tmp/nemu-ios-derived-Release \
            CODE_SIGNING_ALLOWED=NO \
            build

  release-build:
    if: github.event_name == 'workflow_dispatch'
    needs:
      - shared
      - mobile
      - android-native
      - ios-native
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"
      - name: Restore Bun package cache
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Start EAS build
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          EAS_PROJECT_ID: ${{ secrets.EAS_PROJECT_ID }}
          EAS_PROFILE: ${{ inputs.profile }}
          EAS_PLATFORM: ${{ inputs.platform }}
        run: |
          test -n "$EXPO_TOKEN" || (echo "EXPO_TOKEN secret is required" && exit 1)
          test -n "$EAS_PROJECT_ID" || (echo "EAS_PROJECT_ID secret is required" && exit 1)
          cd apps/mobile
          bunx eas-cli@20.5.1 build \
            --profile "$EAS_PROFILE" \
            --platform "$EAS_PLATFORM" \
            --non-interactive
